<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronZero 实机强化学习闭环系统架构设计图</title>
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: #131b2e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #243049;
      --blue: #38bdf8;
      --purple: #a855f7;
      --green: #22c55e;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b, var(--bg-primary) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 900px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .meta-badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }
    .badge.cyan { border-color: rgba(56, 189, 248, 0.4); color: #7dd3fc; }
    .badge.green { border-color: rgba(34, 197, 94, 0.4); color: #86efac; }
    .badge.amber { border-color: rgba(245, 158, 11, 0.4); color: #fde68a; }
    .badge.purple { border-color: rgba(168, 85, 247, 0.4); color: #d8b4fe; }

    .diagram-container {
      width: 100%;
      max-width: 1240px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1100px;
    }

    /* SVG 交互与文字微调 */
    .layer-card {
      transition: filter 0.2s ease, stroke 0.2s ease;
    }
    .layer-card:hover {
      filter: brightness(1.05);
    }

    .node-box {
      transition: transform 0.2s ease;
      cursor: default;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>IronZero 铁锈战争强化学习实机闭环系统架构</h1>
    <p class="subtitle">端到端微观战术强化学习系统架构设计 · 多规模对称竞技场 · 跨语言字节码桥接 · 确定性实时对战闭环</p>
    <div class="meta-badges">
      <span class="badge green">● 实机对抗胜率 75% ~ 100%</span>
      <span class="badge cyan">● 支持 5v5 ~ 25v25 动态规模</span>
      <span class="badge amber">● Annihilation 纯坦克全歼闭环</span>
      <span class="badge purple">● 观测维度弹性切片兼容</span>
    </div>
  </header>

  <div class="diagram-container">
    <svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 箭头标记 -->
        <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
        <marker id="arrow-down-active" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
        <marker id="arrow-up-metric" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
        </marker>

        <!-- 阴影滤镜 -->
        <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
        </filter>

        <!-- 背景渐变 -->
        <linearGradient id="bg-grad-layer1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0c2340" />
          <stop offset="100%" stop-color="#081829" />
        </linearGradient>
        <linearGradient id="bg-grad-layer2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1f1538" />
          <stop offset="100%" stop-color="#120c24" />
        </linearGradient>
        <linearGradient id="bg-grad-layer3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0a2a1b" />
          <stop offset="100%" stop-color="#061a11" />
        </linearGradient>
        <linearGradient id="bg-grad-layer4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2d1c06" />
          <stop offset="100%" stop-color="#1a1003" />
        </linearGradient>
        <linearGradient id="bg-grad-layer5" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2a0c14" />
          <stop offset="100%" stop-color="#17060a" />
        </linearGradient>

        <!-- 节点微渐变 -->
        <linearGradient id="node-cyan" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1e3a5f" />
          <stop offset="100%" stop-color="#0f243e" />
        </linearGradient>
        <linearGradient id="node-purple" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2d1d4d" />
          <stop offset="100%" stop-color="#1b1033" />
        </linearGradient>
        <linearGradient id="node-green" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#134427" />
          <stop offset="100%" stop-color="#0b2817" />
        </linearGradient>
        <linearGradient id="node-amber" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#422909" />
          <stop offset="100%" stop-color="#261704" />
        </linearGradient>
        <linearGradient id="node-rose" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#45121e" />
          <stop offset="100%" stop-color="#290911" />
        </linearGradient>
      </defs>

      <!-- ============================================================== -->
      <!-- LAYER 1: Web GUI & 控制大屏 -->
      <!-- ============================================================== -->
      <g id="layer1" class="layer-card">
        <rect x="40" y="30" width="1120" height="145" rx="12" fill="url(#bg-grad-layer1)" stroke="#0284c7" stroke-width="1.5" filter="url(#box-shadow)" />
        <text x="60" y="60" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="1">1. 前端交互与控制大屏层 (Web GUI &amp; Dashboard)</text>
        <text x="60" y="78" fill="#94a3b8" font-size="11">提供基于浏览器的实时训练监控、参数在线配置、模型评估曲线大屏与全生命周期交互控制</text>

        <!-- Node 1.1 -->
        <g transform="translate(60, 92)" class="node-box">
          <rect width="250" height="65" rx="8" fill="url(#node-cyan)" stroke="#38bdf8" stroke-width="1" />
          <text x="15" y="24" fill="#e0f2fe" font-size="13" font-weight="600">📊 实时指标看板大屏</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● 真实确定性评估胜率 (Win Rate %)</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● Mean Return / 策略损失 / 步进用时</text>
        </g>

        <!-- Node 1.2 -->
        <g transform="translate(330, 92)" class="node-box">
          <rect width="250" height="65" rx="8" fill="url(#node-cyan)" stroke="#38bdf8" stroke-width="1" />
          <text x="15" y="24" fill="#e0f2fe" font-size="13" font-weight="600">⚙️ 对抗参数动态同步</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● 规模配置: 5v5 / 10v10 / 20v20 / 25v25</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● 竞技场选择: IronZero5 ~ IronZero25</text>
        </g>

        <!-- Node 1.3 -->
        <g transform="translate(600, 92)" class="node-box">
          <rect width="250" height="65" rx="8" fill="url(#node-cyan)" stroke="#38bdf8" stroke-width="1" />
          <text x="15" y="24" fill="#e0f2fe" font-size="13" font-weight="600">🚀 预热与初始化策略选择</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● BC Warmstart 专属行为克隆模型载入</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● 克服高维动作空间的"探索荒漠"</text>
        </g>

        <!-- Node 1.4 -->
        <g transform="translate(870, 92)" class="node-box">
          <rect width="265" height="65" rx="8" fill="url(#node-cyan)" stroke="#38bdf8" stroke-width="1" />
          <text x="15" y="24" fill="#e0f2fe" font-size="13" font-weight="600">🛑 训练生命周期管理</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● 开始训练 / 实时推流 (live.jsonl 轮询)</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● 一键中止 Stop / 级联释放端口与内存</text>
        </g>
      </g>

      <!-- 连接线: Layer 1 -> Layer 2 -->
      <path d="M 600 175 L 600 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-down-active)" />
      <text x="615" y="196" fill="#7dd3fc" font-size="11">HTTP REST / 状态轮询</text>

      <!-- ============================================================== -->
      <!-- LAYER 2: 网关与任务调度服务层 -->
      <!-- ============================================================== -->
      <g id="layer2" class="layer-card">
        <rect x="40" y="210" width="1120" height="135" rx="12" fill="url(#bg-grad-layer2)" stroke="#7c3aed" stroke-width="1.5" filter="url(#box-shadow)" />
        <text x="60" y="238" fill="#c084fc" font-size="15" font-weight="700" letter-spacing="1">2. 服务网关与进程调度层 (API Gateway &amp; Process Daemon)</text>
        <text x="60" y="256" fill="#94a3b8" font-size="11">负责统一 API 路由、宿主机实机守护服务、多环境并发调度以及训练事件流中继</text>

        <!-- Node 2.1 -->
        <g transform="translate(60, 268)" class="node-box">
          <rect width="250" height="60" rx="8" fill="url(#node-purple)" stroke="#a855f7" stroke-width="1" />
          <text x="15" y="22" fill="#f3e8ff" font-size="13" font-weight="600">🌐 FastAPI 反向代理网关</text>
          <text x="15" y="38" fill="#94a3b8" font-size="11">● 宿主机 :8100 &amp; Docker 容器 :8000</text>
          <text x="15" y="51" fill="#94a3b8" font-size="11">● 桥接 host.docker.internal 寻址</text>
        </g>

        <!-- Node 2.2 -->
        <g transform="translate(330, 268)" class="node-box">
          <rect width="250" height="60" rx="8" fill="url(#node-purple)" stroke="#a855f7" stroke-width="1" />
          <text x="15" y="22" fill="#f3e8ff" font-size="13" font-weight="600">⚡ rwpp_real_service (:8300)</text>
          <text x="15" y="38" fill="#94a3b8" font-size="11">● 宿主机原生并发调度守护进程</text>
          <text x="15" y="51" fill="#94a3b8" font-size="11">● 动态派发 5000+ TCP 专属端口</text>
        </g>

        <!-- Node 2.3 -->
        <g transform="translate(600, 268)" class="node-box">
          <rect width="250" height="60" rx="8" fill="url(#node-purple)" stroke="#a855f7" stroke-width="1" />
          <text x="15" y="22" fill="#f3e8ff" font-size="13" font-weight="600">🛡️ 活跃进程生命周期管控</text>
          <text x="15" y="38" fill="#94a3b8" font-size="11">● ACTIVE_PROCESSES / STOPPED_JOBS</text>
          <text x="15" y="51" fill="#94a3b8" font-size="11">● Stop 请求拦截与 Java 进程干净终结</text>
        </g>

        <!-- Node 2.4 -->
        <g transform="translate(870, 268)" class="node-box">
          <rect width="265" height="60" rx="8" fill="url(#node-purple)" stroke="#a855f7" stroke-width="1" />
          <text x="15" y="22" fill="#f3e8ff" font-size="13" font-weight="600">📡 事件中继总线 (live.jsonl)</text>
          <text x="15" y="38" fill="#94a3b8" font-size="11">● 增量游标 /events?after=seq</text>
          <text x="15" y="51" fill="#94a3b8" font-size="11">● 无状态、低开销消费更新与评估包</text>
        </g>
      </g>

      <!-- 连接线: Layer 2 -> Layer 3 -->
      <path d="M 600 345 L 600 375" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-down)" />
      <text x="615" y="364" fill="#c084fc" font-size="11">子进程拉起 / 参数注入</text>

      <!-- ============================================================== -->
      <!-- LAYER 3: 算法与强化学习核心层 -->
      <!-- ============================================================== -->
      <g id="layer3" class="layer-card">
        <rect x="40" y="380" width="1120" height="225" rx="12" fill="url(#bg-grad-layer3)" stroke="#16a34a" stroke-width="1.5" filter="url(#box-shadow)" />
        <text x="60" y="408" fill="#4ade80" font-size="15" font-weight="700" letter-spacing="1">3. 强化学习算法与模型核心层 (IronZero RL Core)</text>
        <text x="60" y="426" fill="#94a3b8" font-size="11">包含分布式 PPO 训练器、分层动作空间神经网络、自适应权重切片加载器与高精地形特征编码</text>

        <!-- Node 3.1: 策略网络模块 -->
        <g transform="translate(60, 438)" class="node-box">
          <rect width="360" height="152" rx="8" fill="url(#node-green)" stroke="#22c55e" stroke-width="1" />
          <text x="15" y="24" fill="#dcfce7" font-size="13" font-weight="600">🧠 神经网络模型 (MaskedActorCritic)</text>
          <text x="15" y="46" fill="#86efac" font-size="11" font-weight="500">【特征编码 (668 ~ 768 维观测)】</text>
          <text x="15" y="62" fill="#94a3b8" font-size="11">● 动态实体: 坐标/血量/装填冷却/编队Group</text>
          <text x="15" y="76" fill="#94a3b8" font-size="11">● 4通道静态地形栅格: 高度/水域/阻挡/通道</text>
          
          <text x="15" y="98" fill="#86efac" font-size="11" font-weight="500">【分层动作头 (Hierarchical Action Heads)】</text>
          <text x="15" y="114" fill="#94a3b8" font-size="11">● [Kind:5, Group:4, X:8, Y:8, Target:N+1]</text>
          <text x="15" y="130" fill="#94a3b8" font-size="11">● 动态动作掩码 (Action Masking) 阻断非法行为</text>
        </g>

        <!-- Node 3.2: 训练优化与权重加载 -->
        <g transform="translate(440, 438)" class="node-box">
          <rect width="330" height="152" rx="8" fill="url(#node-green)" stroke="#22c55e" stroke-width="1" />
          <text x="15" y="24" fill="#dcfce7" font-size="13" font-weight="600">⚡ 训练引擎与维度切片机制</text>
          <text x="15" y="46" fill="#86efac" font-size="11" font-weight="500">【PPO + GAE 强化学习】</text>
          <text x="15" y="62" fill="#94a3b8" font-size="11">● 裁剪比率 clip=0.2 / 价值损失 / 熵正则化</text>
          <text x="15" y="76" fill="#94a3b8" font-size="11">● 势函数塑形 + 交战拉扯 + 毁伤奖励机制</text>

          <text x="15" y="98" fill="#86efac" font-size="11" font-weight="500">【自适应维度切片加载器】</text>
          <text x="15" y="114" fill="#94a3b8" font-size="11">● _load_compatible_weights 解决 shape mismatch</text>
          <text x="15" y="130" fill="#94a3b8" font-size="11">● 修复 Exit Code 1 闪退，实现跨规模无缝迁移</text>
        </g>

        <!-- Node 3.3: 评估与专家库 -->
        <g transform="translate(790, 438)" class="node-box">
          <rect width="345" height="152" rx="8" fill="url(#node-green)" stroke="#22c55e" stroke-width="1" />
          <text x="15" y="24" fill="#dcfce7" font-size="13" font-weight="600">🎯 专家预热库与确定性评估</text>
          <text x="15" y="46" fill="#86efac" font-size="11" font-weight="500">【专家行为克隆库 (BC Warmstart)】</text>
          <text x="15" y="62" fill="#94a3b8" font-size="11">● 针对 5v5 / 10v10 / 15v15 / 20v20 / 25v25 全量就绪</text>
          <text x="15" y="76" fill="#94a3b8" font-size="11">● 学习质心突进、残血风筝与最近优先策略</text>

          <text x="15" y="98" fill="#86efac" font-size="11" font-weight="500">【Wilson 95% 置信区间实战评测】</text>
          <text x="15" y="114" fill="#94a3b8" font-size="11">● 纯贪婪关闭随机探索，多局严谨验证胜率</text>
          <text x="15" y="130" fill="#94a3b8" font-size="11">● 实机压测胜率稳定达 75% ~ 100%</text>
        </g>
      </g>

      <!-- 连接线: Layer 3 -> Layer 4 -->
      <path d="M 600 605 L 600 635" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-down)" />
      <text x="615" y="624" fill="#4ade80" font-size="11">VecRwppEnv 并行对战环境派发</text>

      <!-- ============================================================== -->
      <!-- LAYER 4: 跨语言控制桥接层 -->
      <!-- ============================================================== -->
      <g id="layer4" class="layer-card">
        <rect x="40" y="640" width="1120" height="140" rx="12" fill="url(#bg-grad-layer4)" stroke="#d97706" stroke-width="1.5" filter="url(#box-shadow)" />
        <text x="60" y="668" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="1">4. 跨语言控制桥接层 (IronZero Java Bridge &amp; IPC)</text>
        <text x="60" y="686" fill="#94a3b8" font-size="11">Java 25 Agent 字节码注入、全歼胜负判定重载、地图原生 AI 唤醒与防崩溃微步同步</text>

        <!-- Node 4.1 -->
        <g transform="translate(60, 698)" class="node-box">
          <rect width="250" height="65" rx="8" fill="url(#node-amber)" stroke="#f59e0b" stroke-width="1" />
          <text x="15" y="24" fill="#fef3c7" font-size="13" font-weight="600">☕ Java 25 字节码注入 Agent</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● ironzero.IronZeroBridge 自挂载</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● 拦截 RWGameEngine 原生主循环</text>
        </g>

        <!-- Node 4.2 -->
        <g transform="translate(330, 698)" class="node-box">
          <rect width="250" height="65" rx="8" fill="url(#node-amber)" stroke="#f59e0b" stroke-width="1" />
          <text x="15" y="24" fill="#fef3c7" font-size="13" font-weight="600">🏆 全歼判定重载 (--win-mode)</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● clearNativeDefeatFlags() 清除误判</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● 绕过无建造厂判定，依全歼核算胜负</text>
        </g>

        <!-- Node 4.3 -->
        <g transform="translate(600, 698)" class="node-box">
          <rect width="250" height="65" rx="8" fill="url(#node-amber)" stroke="#f59e0b" stroke-width="1" />
          <text x="15" y="24" fill="#fef3c7" font-size="13" font-weight="600">⚔️ AI 激进化唤醒 (--unlock-ai)</text>
          <text x="15" y="42" fill="#94a3b8" font-size="11">● Unit.aiLimitedUse = false</text>
          <text x="15" y="55" fill="#94a3b8" font-size="11">● AI.aggressiveMode = true 主动进攻</text>
        </g>

        <!-- Node 4.4 -->
        <g transform="translate(870, 698)" class="node-box">
