<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronZero 实机强化学习闭环系统架构交互全景图</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --bg-side: #0f172a;
      --border-subtle: #1e293b;
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --color-control: #38bdf8; /* 调度控制流 - 蓝 */
      --color-data: #22c55e;    /* 训练数据流 - 绿 */
      --color-ipc: #f59e0b;     /* 桥接IPC流 - 橙 */
      --color-eval: #c084fc;    /* 评估指标流 - 紫 */
      --color-engine: #f43f5e;  /* 引擎物理层 - 红 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部导航与工具栏 */
    header {
      background: #0f172a;
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 流程流向过滤器 */
    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .filter-btn:hover { color: var(--text-main); background: #1e293b; }
    .filter-btn.active { background: #1e293b; color: #fff; font-weight: 600; }
    .filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* 主工作区分割布局 */
    .main-layout {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左侧画布区 */
    .canvas-pane {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #172033 0%, #0b0f19 80%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
      user-select: none;
    }
    .svg-viewport:active { cursor: grabbing; }

    /* 画布悬浮控制小部件 */
    .canvas-overlay-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .control-btn {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .control-btn:hover { background: #334155; }

    /* 右侧二级详情抽屉面板 */
    .detail-drawer {
      width: 440px;
      background: var(--bg-side);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .detail-drawer.collapsed {
      transform: translateX(100%);
    }

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: #111827;
    }

    .drawer-title-group h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .drawer-title-group .subsystem-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
      margin-top: 4px;
    }

    .drawer-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }
    .drawer-close-btn:hover { color: #fff; }

    .drawer-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    .detail-section {
      margin-bottom: 20px;
      background: #111827;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
    }

    .detail-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .code-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      word-break: break-all;
    }

    .schema-kv {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 6px;
      font-size: 12px;
      margin-top: 6px;
    }
    .schema-kv .key { color: var(--text-dim); }
    .schema-kv .val { color: #e2e8f0; font-family: monospace; }

    ul.feature-list {
      padding-left: 18px;
      color: #cbd5e1;
    }
    ul.feature-list li { margin-bottom: 6px; }

    /* 抽屉浮动触发器 (折叠时提示) */
    .drawer-tab-btn {
      position: absolute;
      right: 0;
      top: 100px;
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 10px 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 15;
      box-shadow: -4px 0 10px rgba(0, 0, 0, 0.3);
    }

    /* SVG 样式与交互响应 */
    .svg-node {
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .svg-node:hover rect.node-card {
      filter: brightness(1.25) drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
      stroke-width: 2px;
    }
    .svg-node.selected rect.node-card {
      stroke: #38bdf8 !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.6)) !important;
    }

    /* 关系连线样式 */
    .edge-line {
      transition: stroke-width 0.2s ease, opacity 0.2s ease;
    }
    .edge-line.active {
      stroke-width: 3.5px !important;
      opacity: 1 !important;
      filter: drop-shadow(0 0 8px currentColor);
    }
    .edge-line.dimmed {
      opacity: 0.15 !important;
    }
    .svg-node.dimmed {
      opacity: 0.25 !important;
    }
  </style>
</head>
<body>

  <!-- 顶部工具栏 -->
  <header>
    <div class="header-left">
      <div class="title-group">
        <h1>IronZero 铁锈战争强化学习实机闭环架构全景图</h1>
        <p>系统拓扑设计 · 跨进程/跨语言边界 · 双向数据闭环 · 点击各模块展开二级规格</p>
      </div>
    </div>

    <!-- 流向高亮过滤切换 -->
    <div class="filter-group">
      <button class="filter-btn active" data-flow="all">
        <span class="dot" style="background: #94a3b8;"></span>全部流向
      </button>
      <button class="filter-btn" data-flow="control">
        <span class="dot" style="background: var(--color-control);"></span>调度控制流
      </button>
      <button class="filter-btn" data-flow="data">
        <span class="dot" style="background: var(--color-data);"></span>RL数据/动作环
      </button>
      <button class="filter-btn" data-flow="ipc">
        <span class="dot" style="background: var(--color-ipc);"></span>Java桥接通信
      </button>
      <button class="filter-btn" data-flow="eval">
        <span class="dot" style="background: var(--color-eval);"></span>评估指标反馈
      </button>
    </div>
  </header>

  <!-- 主工作区 -->
  <div class="main-layout">

    <!-- 画布区 -->
    <div class="canvas-pane" id="canvasPane">
      <svg id="archSvg" class="svg-viewport" viewBox="0 0 1440 920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 箭头定义 -->
          <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
          </marker>
          <marker id="arrow-data" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
          </marker>
          <marker id="arrow-ipc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
          </marker>
          <marker id="arrow-eval" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
          </marker>

          <!-- 区域背景渐变 -->
          <linearGradient id="grad-subsystem-1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0c2340" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#081829" stop-opacity="0.85"/>
          </linearGradient>
          <linearGradient id="grad-subsystem-2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1f1538" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#120c24" stop-opacity="0.85"/>
          </linearGradient>
          <linearGradient id="grad-subsystem-3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a2a1b" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#061a11" stop-opacity="0.85"/>
          </linearGradient>
          <linearGradient id="grad-subsystem-4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2d1c06" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#1a1003" stop-opacity="0.85"/>
          </linearGradient>
          <linearGradient id="grad-subsystem-5" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a0c14" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#17060a" stop-opacity="0.85"/>
          </linearGradient>
        </defs>

        <!-- ============================================================== -->
        <!-- 容器大边界 (SUBSYSTEM BOUNDARIES) -->
        <!-- ============================================================== -->

        <!-- 1. 前端层 -->
        <rect x="30" y="25" width="1380" height="135" rx="14" fill="url(#grad-subsystem-1)" stroke="#0284c7" stroke-width="1.5" />
        <text x="50" y="52" fill="#38bdf8" font-size="14" font-weight="700">【表现层】Web UI 前端控制中心 (web/frontend/)</text>

        <!-- 2. 网关与调度层 -->
        <rect x="30" y="185" width="1380" height="135" rx="14" fill="url(#grad-subsystem-2)" stroke="#7c3aed" stroke-width="1.5" />
        <text x="50" y="212" fill="#c084fc" font-size="14" font-weight="700">【控制网关层】微服务路由与实机守护进程 (FastAPI :8100 &amp; Daemon :8300)</text>

        <!-- 3. RL 算法核心层 -->
        <rect x="30" y="345" width="1380" height="235" rx="14" fill="url(#grad-subsystem-3)" stroke="#16a34a" stroke-width="1.5" />
        <text x="50" y="372" fill="#4ade80" font-size="14" font-weight="700">【决策核心层】强化学习算法与特征引擎 (IronZero RL Core - src/ironzero/)</text>

        <!-- 4. 跨语言桥接层 -->
        <rect x="30" y="605" width="1380" height="145" rx="14" fill="url(#grad-subsystem-4)" stroke="#d97706" stroke-width="1.5" />
        <text x="50" y="632" fill="#fbbf24" font-size="14" font-weight="700">【桥接控制层】Java 25 字节码注入与协议适配 (IronZero Java Bridge - TCP Socket)</text>

        <!-- 5. 原生引擎仿真层 -->
        <rect x="30" y="775" width="1380" height="120" rx="14" fill="url(#grad-subsystem-5)" stroke="#e11d48" stroke-width="1.5" />
        <text x="50" y="802" fill="#fb7185" font-size="14" font-weight="700">【原生仿真层】铁锈战争 PC 引擎独立仿真基座 (RWPP Headless 1.15)</text>

        <!-- ============================================================== -->
        <!-- 连线拓扑 (RELATIONSHIP EDGES) -->
        <!-- ============================================================== -->
        <g id="edgesGroup">
          <!-- 控制流: UI -> FastAPI -->
          <path id="e_ui_api" class="edge-line flow-control" d="M 160 140 L 160 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-ctrl)" />
          <!-- 控制流: FastAPI -> Daemon -->
          <path id="e_api_daemon" class="edge-line flow-control" d="M 270 255 L 370 255" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-ctrl)" />
          <!-- 控制流: Daemon -> PPO Subprocess -->
          <path id="e_daemon_ppo" class="edge-line flow-control" d="M 480 290 L 480 390" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-ctrl)" />

          <!-- 控制流: Daemon -> Stop Signal -->
          <path id="e_daemon_proc" class="edge-line flow-control" d="M 590 255 L 720 255" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-ctrl)" />

          <!-- 数据流: PPO -> VecRwppEnv -->
          <path id="e_ppo_vec" class="edge-line flow-data" d="M 400 460 L 260 460" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-data)" />
          <!-- 数据流: VecRwppEnv -> RwppDuelEnv -->
          <path id="e_vec_duel" class="edge-line flow-data" d="M 160 520 L 160 645" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-data)" />

          <!-- IPC流: RwppDuelEnv <-> Socket IPC -->
          <path id="e_duel_sock" class="edge-line flow-ipc" d="M 270 680 L 370 680" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-ipc)" />
          <!-- IPC流: Socket IPC <-> Java Agent -->
          <path id="e_sock_java" class="edge-line flow-ipc" d="M 590 680 L 720 680" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-ipc)" />

          <!-- 桥接驱动: Java Agent -> RWPP Server -->
          <path id="e_java_rwpp" class="edge-line flow-ipc" d="M 830 725 L 830 815" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-ipc)" />
          
          <!-- 引擎加载: RWPP -> MapLoader -->
          <path id="e_rwpp_map" class="edge-line flow-data" d="M 720 850 L 590 850" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-data)" />

          <!-- 特征流: 地图栅格 -> 特征编码器 -->
          <path id="e_map_obs" class="edge-line flow-data" d="M 480 815 L 480 540" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-data)" />

          <!-- 决策闭环: ObsEncoder -> PolicyNet -> ActionMask -->
          <path id="e_obs_net" class="edge-line flow-data" d="M 590 460 L 720 460" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-data)" />
          <path id="e_net_mask" class="edge-line flow-data" d="M 830 520 L 830 540 L 720 540" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-data)" />

          <!-- 权重预热: BC Warmstart -> Slicer -> PolicyNet -->
          <path id="e_bc_slicer" class="edge-line flow-data" d="M 1250 425 L 1250 490" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-data)" />
          <path id="e_slicer_net" class="edge-line flow-data" d="M 1140 520 L 940 520" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-data)" />

          <!-- 评估反馈流: Policy -> Evaluator -> live.jsonl -> UI -->
          <path id="e_ppo_eval" class="edge-line flow-eval" d="M 480 430 L 480 370 L 1020 370 L 1020 430" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-eval)" />
          <path id="e_eval_bus" class="edge-line flow-eval" d="M 1020 430 L 1020 290" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-eval)" />
          <path id="e_bus_ui" class="edge-line flow-eval" d="M 1020 220 L 1020 140" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-eval)" />
        </g>

        <!-- ============================================================== -->
        <!-- 节点组件 (INTERACTIVE NODES) -->
        <!-- ============================================================== -->

        <!-- NODE 1: Web Dashboard -->
        <g id="node_dash" class="svg-node" transform="translate(50, 65)" onclick="selectNode('node_dash')">
          <rect class="node-card" width="220" height="75" rx="8" fill="#13233a" stroke="#38bdf8" stroke-width="1.5" />
          <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="700">UI · 看板大屏与图表</text>
          <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">Canvas KPI 仪表盘</text>
          <text x="14" y="60" fill="#94a3b8" font-size="10">实时评估胜率/回报折线/日志</text>
        </g>

        <!-- NODE 2: Web Config -->
        <g id="node_config" class="svg-node" transform="translate(370, 65)" onclick="selectNode('node_config')">
          <rect class="node-card" width="220" height="75" rx="8" fill="#13233a" stroke="#38bdf8" stroke-width="1.5" />
          <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="700">UI · 参数配置与同步器</text>
          <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">规模/地图/预热选择</text>
          <text x="14" y="60" fill="#94a3b8" font-size="10">5v5~25v25 | IronZero 地图联动</text>
        </g>

        <!-- NODE 3: Web Lifecycle & Stream -->
        <g id="node_stream" class="svg-node" transform="translate(910, 65)" onclick="selectNode('node_stream')">
          <rect class="node-card" width="220" height="75" rx="8" fill="#13233a" stroke="#38bdf8" stroke-width="1.5" />
          <text x="14" y="24" fill="#38bdf8" font-size="12" font-weight="700">UI · 生命周期与事件消费</text>
          <text x="14" y="44" fill="#f8fafc" font-size="11" font-weight="600">增量游标事件消费</text>
          <text x="14" y="60" fill="#94a3b8" font-size="10">Api.rwppPpoEvents / 优雅中止</text>
        </g>

        <!-- NODE 4: FastAPI Gateway -->
        <g id="node_fastapi" class="svg-node" transform="translate(50, 220)" onclick="selectNode('node_fastapi')">
          <rect class="node-card" width="220" height="70" rx="8" fill="#20153d" stroke="#a855f7" stroke-width="1.5" />
          <text x="14" y="22" fill="#c084fc" font-size="12" font-weight="700">网关 · FastAPI (:8100/:8000)</text>
          <text x="14" y="42" fill="#f8fafc" font-size="11" font-weight="600">跨容器反向代理</text>
          <text x="14" y="58" fill="#94a3b8" font-size="10">/api/rwpp 路由中继 &amp; 错误处理</text>
        </g>

        <!-- NODE 5: Daemon Service -->
        <g id="node_daemon" class="svg-node" transform="translate(370, 220)" onclick="selectNode('node_daemon')">
          <rect class="node-card" width="220" height="70" rx="8" fill="#20153d" stroke="#a855f7" stroke-width="1.5" />
          <text x="14" y="22" fill="#c084fc" font-size="12" font-weight="700">服务 · 实机调度器 (:8300)</text>
          <text x="14" y="42" fill="#f8fafc" font-size="11" font-weight="600">rwpp_real_service.py</text>
          <text x="14" y="58" fill="#94a3b8" font-size="10">动态端口分配池 (5000-5999)</text>
        </g>

        <!-- NODE 6: Process Supervisor -->
        <g id="node_proc" class="svg-node" transform="translate(690, 220)" onclick="selectNode('node_proc')">
          <rect class="node-card" width="220" height="70" rx="8" fill="#20153d" stroke="#a855f7" stroke-width="1.5" />
          <text x="14" y="22" fill="#c084fc" font-size="12" font-weight="700">治理 · 进程生命周期监管</text>
          <text x="14" y="42" fill="#f8fafc" font-size="11" font-weight="600">ACTIVE_PROCESSES 锁</text>
          <text x="14" y="58" fill="#94a3b8" font-size="10">Stop 请求拦截 / 级联清理孤儿</text>
        </g>

    // 交互逻辑
    let currentFlow = "all";
    let selectedNodeId = null;

    function selectNode(nodeId) {
      selectedNodeId = nodeId;
      const data = NODE_DETAILS[nodeId];
      if (!data) return;

      // 更新 SVG 节点高亮
      document.querySelectorAll(".svg-node").forEach(el => {
        el.classList.remove("selected");
      });
      const nodeEl = document.getElementById(nodeId);
      if (nodeEl) nodeEl.classList.add("selected");

      // 展开抽屉
      toggleDrawer(true);

      // 填充二级技术规格
      document.getElementById("dTitle").textContent = data.title;
      const tagEl = document.getElementById("dTag");
      tagEl.textContent = data.subsystem;
      tagEl.style.background = data.tagColor + "22";
      tagEl.style.color = data.tagColor;

      const bodyEl = document.getElementById("dBody");
      bodyEl.innerHTML = `
        <div class="detail-section">
          <h3>📌 架构职责与定位</h3>
          <p>${data.role}</p>
          <div style="margin-top: 8px;">
            <span style="color:#64748b; font-size:11px;">核心源文件：</span><br/>
            <span class="code-badge">${data.file}</span>
          </div>
        </div>

        <div class="detail-section">
          <h3>🔄 输入与输出技术契约 (I/O Schema)</h3>
          <div class="schema-kv">
            <span class="key">Input:</span>
            <span class="val">${data.inputs}</span>
          </div>
          <div class="schema-kv">
            <span class="key">Output:</span>
            <span class="val">${data.outputs}</span>
          </div>
        </div>

        <div class="detail-section">
          <h3>⚙️ 核心实现机制与关键技术</h3>
          <ul class="feature-list">
            ${data.mechanism.map(item => `<li>${item}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    function toggleDrawer(open) {
      const drawer = document.getElementById("detailDrawer");
      const tabBtn = document.getElementById("drawerTabBtn");
      if (open) {
        drawer.classList.remove("collapsed");
        tabBtn.style.display = "none";
      } else {
        drawer.classList.add("collapsed");
        tabBtn.style.display = "flex";
      }
    }

    // 流向过滤高亮
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFlow = btn.getAttribute("data-flow");
        applyFlowFilter(currentFlow);
      });
    });

    function applyFlowFilter(flow) {
      const edges = document.querySelectorAll(".edge-line");
      const nodes = document.querySelectorAll(".svg-node");

      if (flow === "all") {
        edges.forEach(e => { e.classList.remove("dimmed", "active"); });
        nodes.forEach(n => { n.classList.remove("dimmed"); });
        return;
      }

      edges.forEach(e => {
        if (e.classList.contains("flow-" + flow)) {
          e.classList.add("active");
          e.classList.remove("dimmed");
        } else {
          e.classList.remove("active");
          e.classList.add("dimmed");
        }
      });
    }

    // 画布缩放/平移逻辑
    let zoomLevel = 1.0;
    const svgEl = document.getElementById("archSvg");

    function zoomIn() {
      zoomLevel = Math.min(2.5, zoomLevel + 0.2);
      svgEl.style.transform = `scale(${zoomLevel})`;
      svgEl.style.transformOrigin = "center center";
    }

    function zoomOut() {
      zoomLevel = Math.max(0.6, zoomLevel - 0.2);
      svgEl.style.transform = `scale(${zoomLevel})`;
      svgEl.style.transformOrigin = "center center";
    }

    function resetZoom() {
      zoomLevel = 1.0;
      svgEl.style.transform = "scale(1.0)";
    }

    // 默认高亮并展开 PPO 算法优化器节点
    window.addEventListener("DOMContentLoaded", () => {
      selectNode("node_ppo");
    });
  </script>
