# SPDX-License-Identifier: Apache-2.0
# IronZero training / inference platform.
#
# Host:  http://127.0.0.1:8000
# Runs:  ./runs on the host is mounted into /app/runs inside the container,
#        so checkpoints and replays survive container rebuilds.
name: ironzero-platform

services:
  platform:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
    image: ironzero-platform:latest
    container_name: ironzero-platform
    ports:
      - "8000:8000"
    environment:
      IRONZERO_RUNS: /app/runs/platform
      IRONZERO_CHECKPOINT_ROOTS: /app/runs
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../runs:/app/runs
      # Live frontend mount: edit web/frontend/* and refresh the browser without rebuilding.
      - ../web/frontend:/app/web/frontend:ro
    restart: unless-stopped
