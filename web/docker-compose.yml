# SPDX-License-Identifier: Apache-2.0
# IronZero training / inference platform.
#
# Host:  http://127.0.0.1:8000
# Runs:  ./runs on the host is mounted into /app/runs inside the container,
#        so checkpoints and replays survive container rebuilds.
name: ironzero-platform

services:
  platform:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
    image: ironzero-platform:latest
    container_name: ironzero-platform
    ports:
      - "8000:8000"
    environment:
      IRONZERO_RUNS: /app/runs/platform
      IRONZERO_CHECKPOINT_ROOTS: /app/runs
      IRONZERO_GAME_ASSETS: /app/game_cache
      IRONZERO_RWPP_SERVICE: http://host.docker.internal:8300
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Shanghai"
    volumes:
      - ../runs:/app/runs
      # Live frontend and backend mounts: edit web/* without rebuilding container.
      - ../web/frontend:/app/web/frontend:ro
      - ../web/backend:/app/web/backend:ro
      # Local copy of game tilesets/maps/sprites for the in-game sandbox renderer.
      - ../.game_cache:/app/game_cache:ro
    restart: unless-stopped
